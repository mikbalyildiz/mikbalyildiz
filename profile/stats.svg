<svg xmlns="http://www.w3.org/2000/svg" width="860" height="224" viewBox="0 0 860 224">
<style>.t{font:600 20px 'Segoe UI',Ubuntu,sans-serif;fill:#2C9AB7}.d{font:800 42px 'Segoe UI',Ubuntu,sans-serif;fill:#2C9AB7}.m{font:600 15px 'Segoe UI',Ubuntu,sans-serif;fill:#ffffff}.s{font:400 12.5px 'Segoe UI',Ubuntu,sans-serif;fill:#9fb3bd}.k{opacity:0;animation:g .6s ease-out forwards}@keyframes g{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}</style>
<rect width="860" height="224" rx="8" fill="#0f2027"/>
